pipeline:
  name: "VSP-Coder"
  source: local
  output: local
  prompts_dir: .pipeline/prompts
  reports_dir: .pipeline/reports

default_workflow_kind: build

plan:
  mode: interactive
  interaction_depth: medium
  interactive:
    min_rounds: 3
    require_explicit_confirm: true

execution:
  mode: self
  steps:
    preset: tdd
  test_profiles:
    enabled: true
    selection: manual
    compose: true
    profiles:
      - webapp

evaluation:
  auto_continue: true
  max_diff_score: 3
  checks:
    - tests_pass
    - no_regressions
    - matches_plan
    - code_quality
