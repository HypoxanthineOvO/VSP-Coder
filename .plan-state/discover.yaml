goal: >
  Run a full-stack code audit for VSP-Coder, explain known user-facing bugs
  against audit findings, then produce a prioritized repair and experience
  optimization plan.
known_bugs:
  - "Frontend opens an old session by default."
  - "Switching reasoning effort such as xhigh is slow and can fail."
  - "Message sending animation is very janky."
  - "On narrower desktop widths, the left Project/session navigation can disappear."
  - "Subagent traces are not recognized and cannot be opened for interaction."
  - "Errors such as HTTP 502 are not captured or surfaced clearly."
  - "Frontend animations need a unified interaction and motion system."
post_audit_bug_checklist:
  - bug: "Frontend opens an old session by default."
    audit_requirement: "Explain selection, persistence, sorting, and hydration behavior; decide why last selected session is not restored."
    repair_plan_requirement: "Restore the user's last selected session when available, with a deterministic fallback."
  - bug: "Switching reasoning effort such as xhigh is slow and can fail."
    audit_requirement: "Trace UI action, API action, provider capability validation, optimistic state, and failure rollback."
    repair_plan_requirement: "Make reasoning switches fast, observable, retryable, and resilient to provider/API errors."
  - bug: "Message sending animation is very janky."
    audit_requirement: "Profile composer, pending queue rendering, message list updates, layout thrash, and expensive animations."
    repair_plan_requirement: "Replace janky send feedback with the unified motion system and measurable smoothness checks."
  - bug: "On narrower desktop widths, the left Project/session navigation can disappear."
    audit_requirement: "Review responsive grid constraints, rail collapse rules, resize handles, and desktop narrow breakpoints."
    repair_plan_requirement: "Keep project/session navigation reachable at constrained desktop widths."
  - bug: "Subagent traces are not recognized and cannot be opened for interaction."
    audit_requirement: "Trace protocol item mapping, server artifact/message conversion, frontend detection, modal/detail state, and interaction affordances."
    repair_plan_requirement: "Expose Subagent traces as recognizable, openable, and interaction-ready UI elements when protocol data allows."
  - bug: "Errors such as HTTP 502 and 429 are not captured or surfaced clearly."
    audit_requirement: "Trace HTTP, SSE, provider, queue, and send failures end-to-end; verify all user-relevant errors render in the UI."
    repair_plan_requirement: "Add bottom error cards, retry cards, redacted technical details, and tiered recovery behavior."
  - bug: "Frontend animations need a unified interaction and motion system."
    audit_requirement: "Inventory transitions, animation durations, easing, reduced-motion behavior, and components with layout jank."
    repair_plan_requirement: "Define and apply a coherent motion system across send, panel switching, list expansion, loading, and error states."
user_decisions:
  - "Audit first, but keep the known bug list as explicit evidence targets."
  - "After audit, explain each known bug's likely root cause before proposing fixes."
  - "Cover frontend, backend logic, protocol boundaries, persistence, scripts, docs, tests, security, and extensibility."
  - "Default session behavior should prefer the user's last selected session."
  - "Validation should be automated as much as possible."
  - "Playwright scenarios and screenshot checks are required."
  - "Initial browser target can be Chromium unless later compatibility findings justify broader coverage."
  - "All request and provider errors, including HTTP 502 and 429, must render in the UI."
  - "Error UX should include a bottom error card and retry card."
  - "Error cards may show type, HTTP status, user-facing explanation, retry action, and expandable redacted technical details."
  - "Retry and recovery behavior should be tiered by error type, for example 429 cooldown, 502/SSE reconnect, and send failure draft/queue preservation."
validation_preferences:
  - "workspace tests, typecheck, and build"
  - "Playwright end-to-end scenarios"
  - "responsive screenshot checks"
  - "performance-oriented checks for janky animations and slow controls where feasible"
unresolved_questions:
  - "Keep Firefox/WebKit as optional smoke coverage after Chromium-only mainline validation."
  - "Generate should persist worker separation as recommended unless the user requests strict."
