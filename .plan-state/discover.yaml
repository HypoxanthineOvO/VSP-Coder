phase: P1-discover
language: zh-CN
project: VSP-Coder
cycle:
  id: C2
  name: Codex Session Adapter
  workflow_kind: build
  preset: tdd
status: completed
rounds_completed: 11
minimum_rounds: 3
context_sources:
  - .pipeline/archives/C1-mock-chat-workspace-and-interaction-protocol/summary.md
  - .pipeline/knowledge/knowledge.compact.md
  - .pipeline/design-spec.md
  - .pipeline/architecture.md
goal: >
  Build the complete Codex adapter for VSP-Coder by connecting the C1
  backend-owned message manager and UI protocol to real Codex sessions, then
  capture the refined provider protocol in knowledge for later adapters.
user_decisions:
  - C2 is a complete Codex tool/adaptor cycle, not a minimal validation spike.
  - Use the official and most reliable Codex integration path; prefer app-server
    and generated local schema over TUI scraping.
  - Browser clients must talk only to VSP-Coder server.
  - VSP-Coder server owns queue/steer and drives real Codex.
  - Use the current OS user's working Codex CLI environment; do not build browser
    login/token UI.
  - Do not expose raw Codex WebSocket to browsers.
  - Final acceptance is manual in a disposable tmp project.
  - Before acceptance, do not mutate existing non-tmp Codex threads.
  - Rename must persist in Codex canonical storage, equivalent to CLI /rename.
  - Do not hardcode user-specific paths such as /home/heyx, except disposable tmp
    fixtures.
  - Mock and tmp QA data are dev/test-only after acceptance.
  - Local VSP-Coder metadata is per-user/per-deployment and gitignored.
  - Project discovery should come from Codex thread cwd metadata, not fixed
    project fixtures.
  - Local deployment defaults to full automation and danger-full-access.
  - Published builds must expose real automation settings.
acceptance_bar: >
  The user manually operates the frontend against a disposable tmp project,
  covering settings, real Codex discovery, thread start/resume, streaming
  response, command and file-change approval, preview, token/status, interrupt
  and queue behavior, real rename persistence across refresh/restart, and then
  enters accept.
non_goals:
  - Multi-user remote runner orchestration.
  - Browser Codex login or token/account management.
  - OpenCode or Claude Code adapters.
  - Full policy engine.
  - Electron or VSCode shell.
  - Rich diff editor.
  - Full terminal emulator.
risks:
  - Codex app-server is experimental and local schema may shift across CLI
    versions.
  - Rename must be verified against canonical Codex storage, not VSP cache.
  - Approval profile mapping may need empirical adjustment.
  - Existing C1 mock fixtures include hardcoded local paths that must be removed
    from production mode.
