phase: P2-decompose
language: zh-CN
project: VSP-Coder
cycle:
  id: C2
  name: Codex Session Adapter
  workflow_kind: build
  preset: tdd
status: confirmed
milestones:
  - id: M01
    name: Configuration, Automation Profiles, And No-Hardcode Baseline
    objective: >
      Create the real instance configuration path, make automation profiles
      frontend/backend consistent, remove production hardcoded user paths, and
      isolate mock/tmp data behind dev/test mode.
    validation:
      - Local ignored config controls deployment mode and default profile.
      - Frontend settings can switch available automation profiles.
      - Backend persists and applies the selected profile.
      - Production code no longer hardcodes /home/heyx or fixed demo projects.
      - Mock/tmp sessions are visible only in dev/test mode.

  - id: M02
    name: Codex App-Server Client Foundation
    objective: >
      Add Codex app-server process management and a typed JSON-RPC client based
      on generated schema artifacts.
    validation:
      - Backend can start/connect to codex app-server.
      - Health, startup failure, disconnect, and restart states are visible.
      - Tests cover JSON-RPC request/response/notification plumbing.

  - id: M03
    name: Codex Thread And Project Discovery
    objective: >
      Replace mock-default discovery with Codex thread/project discovery using
      thread list/read/resume metadata, especially cwd.
    validation:
      - Existing Codex sessions can be listed without mutation.
      - Projects are aggregated from real thread cwd values.
      - Empty state supports opening a local directory for a new thread.
      - Before acceptance, non-tmp threads are read-only.

  - id: M04
    name: Thread Start, Resume, Queue, And Steer
    objective: >
      Start and resume real Codex threads and route all frontend messages through
      the VSP server queue into turn/start or turn/steer.
    validation:
      - Tmp project can create a real Codex thread.
      - Resumed threads load canonical Codex messages/turns.
      - One thread has at most one active turn; extra messages queue safely.

  - id: M05
    name: Streaming, Event, And Metric Mapping
    objective: >
      Map Codex deltas, completed items, status changes, warnings, errors,
      token usage, and rate-limit updates into the VSP protocol.
    validation:
      - Frontend streams real assistant output.
      - Status, error, token, and rate-limit surfaces update from Codex events.
      - Knowledge documents the evolving VSP provider protocol and Codex mapping.

  - id: M06
    name: Approval And Automation Strategy
    objective: >
      Map Codex server requests into VSP request cards and make automation
      profiles materially affect request routing.
    validation:
      - Manual profile shows command and file-change approval cards.
      - Full automation profile does not require frontend approval for normal
        local operation.
      - Permission, tool user-input, and MCP elicitation mappings are covered.

  - id: M07
    name: File Changes, Command Output, And Preview
    objective: >
      Surface command output summaries, changed files, diffs, and preview targets
      from real Codex turns.
    validation:
      - Tmp prompt produces visible command result and file change preview.
      - Safe file preview remains project-root confined.
      - Full terminal and rich diff editor remain deferred.

  - id: M08
    name: Interrupt, Queue Controls, And Error Recovery
    objective: >
      Connect interrupt, pending queue controls, app-server crash recovery, and
      multi-window state synchronization for real Codex sessions.
    validation:
      - turn/interrupt works from the frontend.
      - Clear queue affects pending VSP messages only.
      - app-server restart/disconnect produces understandable UI state.

  - id: M09
    name: Rename And Persistence Verification
    objective: >
      Implement real Codex thread rename and verify canonical persistence across
      refresh and VSP server restart.
    validation:
      - Rename calls Codex thread/name/set.
      - VSP refreshes the canonical name from Codex.
      - Tmp thread name survives browser refresh and server restart.

  - id: M10
    name: Tmp QA Harness, Knowledge Finalization, And Acceptance Gate
    objective: >
      Package disposable tmp QA, final manual test script, knowledge protocol
      docs, and the explicit user accept gate for C2.
    validation:
      - Tmp fixture is generated and isolated.
      - Manual QA script covers the full C2 acceptance chain.
      - Final protocol and adapter mapping docs are complete.
      - User accepts or rejects C2 explicitly.
test_strategy:
  automated:
    - typecheck/build/test across workspaces
    - config/profile mapping tests
    - no-hardcoded-user-path checks
    - Codex JSON-RPC client plumbing tests
    - adapter mapping fixture tests
    - queue/rename/discovery backend tests
  manual:
    - focused check after each Milestone
    - final tmp-project Codex walkthrough before accept
status_notes:
  confirmed_by_user: true
  p3_ready: true
